<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050706">
<title>The Banshee Labyrinth · Pick a Track</title>
<link rel="icon" href="assets/banshee-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --g:#6ef0a0; --ink:#f3efe4; --mute:#aab6af; --bg:#050706; --card:#0e1512; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Oswald',sans-serif; min-height:100vh;
         background-image:radial-gradient(70% 30% at 0 40%,rgba(20,90,50,.5),transparent 70%),radial-gradient(70% 30% at 100% 70%,rgba(20,90,50,.4),transparent 70%); }
  .wrap { max-width:520px; margin:0 auto; padding:16px 16px 120px; }
  header img { display:block; height:104px; width:auto; margin:0 auto; }
  header p { margin:4px 0 0; text-align:center; font-size:13px; letter-spacing:.38em; color:var(--g); font-weight:500; }
  #bal { margin:16px 0 14px; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid rgba(110,240,160,.35); border-radius:14px; padding:12px 14px; }
  #bal .n { font-family:'Bebas Neue',sans-serif; font-size:52px; line-height:1; color:var(--g); min-width:42px; text-align:center; }
  #bal .l { flex:1; font-size:14px; letter-spacing:.12em; color:var(--mute); line-height:1.3; }
  #bal .l small { display:block; font-size:11px; letter-spacing:.14em; opacity:.8; }
  button { font-family:inherit; cursor:pointer; }
  .btn { background:var(--g); color:#04110a; border:0; border-radius:10px; padding:12px 16px; font-weight:700; font-size:15px; letter-spacing:.1em; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.3); }
  .btn:disabled { opacity:.5; }
  #q { width:100%; background:var(--card); color:var(--ink); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:15px 16px; font:500 18px 'Oswald',sans-serif; outline:none; }
  #q:focus, .inp:focus { border-color:var(--g); }
  .inp { width:100%; background:var(--card); color:var(--ink); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:15px 16px; font:500 18px 'Oswald',sans-serif; outline:none; margin-bottom:8px; }
  #modes { display:flex; gap:8px; margin-bottom:10px; }
  .mode { flex:1; background:transparent; color:var(--mute); border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:11px 8px; font-weight:600; font-size:15px; letter-spacing:.1em; }
  .mode.on { background:rgba(110,240,160,.14); color:var(--g); border-color:var(--g); }
  #bnav { display:flex; gap:8px; margin-bottom:8px; }
  #bnav button { flex:1; background:transparent; color:var(--mute); border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:8px; font-weight:600; font-size:13px; letter-spacing:.14em; }
  #bnav button.on { color:var(--g); border-color:var(--g); background:rgba(110,240,160,.1); }
  #letters { display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; }
  #letters::-webkit-scrollbar, #carousel::-webkit-scrollbar { display:none; }
  .lt { flex:none; min-width:38px; height:38px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:transparent; color:var(--ink); font-weight:600; font-size:16px; }
  .lt.on { background:var(--g); color:#04110a; border-color:var(--g); }
  .lt:disabled { opacity:.22; }
  #carousel { position:relative; display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-left:16px; padding:4px 2px 12px; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin:0 -16px; padding-left:16px; padding-right:16px; }
  #carousel .msg { padding:20px 0; width:100%; }
  #carousel.hold { scroll-snap-type:none; scroll-behavior:auto; }
  .bc { flex:0 0 calc((100% - 12px) / 2); align-self:flex-start; display:block; min-width:0; scroll-snap-align:start; background:none; border:0; color:var(--ink); text-align:left; padding:0; }
  .bc img, .bc .ph { width:100%; aspect-ratio:1/1; height:auto; box-sizing:border-box; border-radius:10px; object-fit:cover; background:#16201b; display:block; border:2px solid transparent; }
  .bc img.round, .bc .ph.round { border-radius:50%; }
  .bc.sel img, .bc.sel .ph { border-color:var(--g); }
  .bc .t { margin-top:7px; font-weight:600; font-size:15px; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bc .a { font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #cnav { display:flex; gap:10px; margin:2px 0 6px; }
  #cnav button { flex:1; height:56px; border-radius:14px; border:1px solid rgba(255,255,255,.22); background:var(--card); color:var(--g); font-size:26px; font-weight:700; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #cnav button:active { background:rgba(110,240,160,.18); }
  .pill { display:none; align-items:center; gap:10px; background:rgba(110,240,160,.1); border:1px solid var(--g); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .pill span { flex:1; font-weight:600; font-size:18px; }
  .pill button { background:transparent; border:0; color:var(--ink); font-size:20px; padding:2px 8px; }
  .lbl { margin:2px 2px 8px; font-size:12px; letter-spacing:.3em; color:var(--g); font-weight:600; }
  .item .ph.round, .item img.round { border-radius:50%; }
  h3 { margin:22px 2px 8px; font-size:13px; letter-spacing:.34em; font-weight:600; color:var(--g); }
  .item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); color:var(--ink); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:8px; margin-bottom:8px; }
  .item img, .item .ph { width:54px; height:54px; border-radius:8px; object-fit:cover; background:#16201b; flex:none; }
  .item .t { font-weight:600; font-size:18px; line-height:1.15; }
  .item .a { font-size:14px; color:var(--mute); }
  .item .nm { min-width:0; flex:1; }
  .item .nm div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .w { flex:none; text-align:right; font-size:11px; letter-spacing:.12em; color:var(--g); }
  .item .w b { display:block; font-size:18px; color:var(--ink); letter-spacing:0; }
  .item.mine { border-color:rgba(110,240,160,.5); }
  .msg { text-align:center; color:var(--mute); padding:28px 12px; line-height:1.5; }
  .gate { text-align:center; padding:48px 20px; }
  .gate h2 { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:44px; margin:0 0 8px; color:var(--g); }
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet { width:100%; max-width:520px; background:#0b110e; border:1px solid rgba(110,240,160,.35); border-radius:18px 18px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 4px; font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:34px; letter-spacing:.02em; }
  .sheet p { margin:0 0 14px; color:var(--mute); font-size:15px; line-height:1.4; }
  .row2 { display:flex; gap:10px; }
  .row2 .btn { flex:1; }
  .tier { display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--card); color:var(--ink); border:2px solid var(--g); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .tier .p { font-family:'Bebas Neue',sans-serif; font-size:38px; color:var(--g); }
  .tier .g { font-size:20px; font-weight:600; letter-spacing:.06em; }
  .tier .b { font-size:11px; background:var(--g); color:#04110a; padding:2px 8px; border-radius:6px; font-weight:700; letter-spacing:.1em; margin-left:8px; }
  #toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#0b110e; border:1px solid var(--g); border-radius:12px; padding:12px 16px; max-width:90%; font-size:15px; text-align:center; z-index:30; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="assets/banshee-logo.png" alt="The Banshee Labyrinth"><p>THE UNDERGROUND JUKEBOX</p></header>
  <div id="app"></div>
</div>
<div id="toast"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script src="config.js"></script>
<script>
(function () {
  const CFG = window.BANSHEE, W = CFG.workerUrl;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const mmss = ms => { ms = Math.max(0, Math.round(ms / 1000)); return Math.floor(ms / 60) + ':' + String(ms % 60).padStart(2, '0'); };

  // ── session: arrives via the QR on the screen (?s=TOKEN) ──
  const u = new URL(location.href);
  const fromQr = u.searchParams.get('s');
  if (fromQr) { ls.set('bb_session', fromQr); u.searchParams.delete('s'); history.replaceState(null, '', u.pathname + u.search); }
  let session = ls.get('bb_session') || '';
  const fromTable = u.searchParams.get('table');
  if (fromTable) { u.searchParams.delete('table'); history.replaceState(null, '', u.pathname + u.search); }
  let device = ls.get('bb_device');
  if (!device) { device = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); ls.set('bb_device', device); }

  async function api(path, opts = {}) {
    const res = await fetch(W + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Session': session, ...(opts.headers || {}) } });
    let data = {}; try { data = await res.json(); } catch (e) {}
    return { status: res.status, ...data };
  }

  let searchBusy = false;
  let plays = 0, code = '', state = null, results = [];
  const mine = new Set(JSON.parse(ls.get('bb_mine') || '[]'));
  function toast(msg, ms = 4500) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms); }
  function gate(msg) {
    $('app').innerHTML = `<div class="gate"><h2>Scan to start</h2><div class="msg">${esc(msg || 'Scan the QR code on your table or the jukebox screen to start picking tracks.')}</div></div>`;
  }

  function shell() {
    $('app').innerHTML = `
      <div id="bal"><div class="n" id="plays">0</div><div class="l">PLAYS LEFT<small id="code"></small></div><button class="btn" id="buy">GET PLAYS</button></div>
      <div id="modes"><button class="mode" data-m="browse" id="mBrowse" style="display:none">BROWSE</button><button class="mode on" data-m="artist">BY ARTIST</button><button class="mode" data-m="song">BY SONG</button></div>
      <div id="browseBox" style="display:none">
        <div id="bnav"><button class="on" data-k="artists">ARTISTS A–Z</button><button data-k="albums">ALBUMS A–Z</button></div>
        <div id="letters"></div>
        <div id="bpill" class="pill"><span id="bpillName"></span><button id="bpillX" aria-label="Back to browsing">&#10005;</button></div>
        <div id="carousel"></div>
        <div id="cnav"><button id="cPrev" aria-label="Back (hold to scroll)">&#9664;</button><button id="cNext" aria-label="Forward (hold to scroll)">&#9654;</button></div>
      </div>
      <div id="artistBox">
        <div id="artistStep"><input id="qa" class="inp" type="search" placeholder="Start typing an artist name" autocomplete="off" autocapitalize="off" enterkeyhint="search"><div id="artistList"></div></div>
        <div id="artistPill" class="pill"><span id="pillName"></span><button id="pillX" aria-label="Choose a different artist">&#10005;</button></div>
        <input id="qt" class="inp" type="search" placeholder="Pick from the list or type to search" autocomplete="off" autocapitalize="off" style="display:none">
      </div>
      <div id="songBox" style="display:none"><input id="qs" class="inp" type="search" placeholder="Start typing a song name" autocomplete="off" autocapitalize="off" enterkeyhint="search"></div>
      <div id="results"></div>
      <h3>UP NEXT ON THE SCREEN</h3>
      <div id="queue"></div>`;
    $('buy').onclick = openBuy;
    document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.m));
    const deb = (fn) => { let t; return () => { clearTimeout(t); t = setTimeout(fn, 350); }; };
    $('qa').oninput = deb(searchArtists); $('qt').oninput = deb(loadTracks); $('qs').oninput = deb(searchSongs);
    $('pillX').onclick = resetArtist;
    document.querySelectorAll('#bnav button').forEach(b => b.onclick = () => { bKind = b.dataset.k; bLetter = ''; bArtist = null; artist = null; albumCtx = null; results = []; paintResults(); loadLetters(); });
    $('bpillX').onclick = () => { bArtist = null; artist = null; albumCtx = null; results = []; paintResults(); loadLetters(); };
    holdScroll($('cPrev'), -1); holdScroll($('cNext'), 1);
    $('carousel').addEventListener('click', onCarouselClick); $('carousel').addEventListener('scroll', onCarouselScroll, { passive: true });
    initBrowse();
    refreshBal(); pollState(); setInterval(pollState, 8000);
  }
  function paintBal() { $('plays').textContent = plays; $('code').innerHTML = code ? 'YOUR CODE: ' + esc(code) : ''; }
  async function refreshBal() {
    const r = await api('/balance?device_id=' + encodeURIComponent(device));
    if (r.status === 401) return gate();
    if (r.plays !== undefined) { plays = r.plays; code = r.code || ''; paintBal(); }
    return plays;
  }

  // ── wait time maths (same as the screen) ──
  function waits() {
    if (!state) return null;
    const t = state.track;
    let acc = t ? Math.max(0, t.duration - (t.progress + (state.playing ? Date.now() - state.recvAt : 0))) : 0;
    const map = {};
    (state.queue || []).forEach(x => { map[x.uri] = acc; acc += x.duration; });
    return { map, end: acc };
  }
  async function pollState() {
    try { state = await (await fetch(W + '/state')).json(); state.recvAt = Date.now(); } catch (e) { return; }
    paintQueue(); paintResults();
  }
  function paintQueue() {
    const w = waits(); if (!w || !$('queue')) return;
    const q = state.queue || [];
    $('queue').innerHTML = q.length ? q.map(x =>
      `<div class="item${mine.has(x.uri) ? ' mine' : ''}">${x.image ? `<img src="${esc(x.image)}" alt="">` : '<div class="ph"></div>'}` +
      `<div class="nm"><div class="t">${esc(x.name)}${mine.has(x.uri) ? ' · YOURS' : ''}</div><div class="a">${esc(x.artist)}</div></div>` +
      `<div class="w">PLAYS IN<b>${mmss(w.map[x.uri])}</b></div></div>`).join('')
      : '<div class="msg">Nothing waiting. Pick the next track.</div>';
  }

  // ── search + request ──
  let mode = 'artist', artist = null;
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    $('artistBox').style.display = m === 'artist' ? '' : 'none';
    $('songBox').style.display = m === 'song' ? '' : 'none';
    $('browseBox').style.display = m === 'browse' ? '' : 'none';
    bArtist = null; albumCtx = null;
    resetArtist(); $('qs').value = ''; results = []; paintResults();
    if (m === 'browse') loadLetters();
  }

  // ── browse: swipeable covers, artists or albums A–Z ──
  let bKind = 'artists', bLetter = '', bArtist = null, bLetters = {}, albumCtx = null;
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  async function initBrowse() {
    const r = await api('/browse/letters?kind=artists');
    if (r.status === 401) return gate();
    if (r.letters && Object.keys(r.letters).length) { $('mBrowse').style.display = ''; setMode('browse'); }
  }
  async function loadLetters() {
    $('bpill').style.display = 'none'; $('bnav').style.display = 'none'; $('letters').style.display = ''; $('carousel').style.display = ''; $('cnav').style.display = '';
    document.querySelectorAll('#bnav button').forEach(b => b.classList.toggle('on', b.dataset.k === bKind));
    const r = await api('/browse/letters?kind=' + bKind);
    if (r.status === 401) return gate();
    bLetters = r.letters || {};
    if (!bLetters[bLetter]) bLetter = LETTERS.find(l => bLetters[l]) || '';
    paintLetters(); loadCards();
  }
  function paintLetters() {
    $('letters').innerHTML = LETTERS.map(l => `<button class="lt${l === bLetter ? ' on' : ''}" data-l="${l}"${bLetters[l] ? '' : ' disabled'}>${l}</button>`).join('');
    $('letters').querySelectorAll('.lt').forEach(b => b.onclick = () => { bLetter = b.dataset.l; albumCtx = null; results = []; paintResults(); paintLetters(); loadCards(); });
    const on = $('letters').querySelector('.on'); if (on) $('letters').scrollLeft = Math.max(0, on.offsetLeft - 90);
  }
  // The strip runs on from letter to letter by itself; the letter buttons jump and follow along.
  let cardItems = [], flowOrder = [], flowIdx = 0, flowSeq = 0, flowBusy = false, scrollRaf = 0;
  const cardHtml = (x, i, L) => {
    const isArtist = !bArtist && bKind === 'artists';
    return `<button class="bc" data-i="${i}" data-l="${L || ''}">${x.image ? `<img${isArtist ? ' class="round"' : ''} src="${esc(x.image)}" alt="" loading="lazy">` : `<div class="ph${isArtist ? ' round' : ''}"></div>`}` +
      `<div class="t">${esc(x.name)}</div><div class="a">${esc(isArtist ? 'tap to see songs' : (x.artist + (x.year ? ' · ' + x.year : '')))}</div></button>`;
  };
  async function loadCards() {
    const box = $('carousel'), seq = ++flowSeq; cardItems = [];
    if (bArtist) {
      // No album lists: go straight to the artist's tracks.
      box.innerHTML = ''; box.style.display = 'none'; $('cnav').style.display = 'none'; return;
    }
    if (!bLetter) { box.innerHTML = '<div class="msg">Nothing to browse yet.</div>'; return; }
    flowOrder = LETTERS.filter(l => bLetters[l]); flowIdx = Math.max(0, flowOrder.indexOf(bLetter));
    box.innerHTML = '<div class="msg">Loading…</div>';
    flowBusy = false; await flowMore(seq, true);
  }
  async function flowMore(seq, first) {
    const box = $('carousel'); if (flowBusy) return; flowBusy = true;
    try {
      while (seq === flowSeq && flowIdx < flowOrder.length && (first || box.scrollWidth - box.scrollLeft < box.clientWidth * 3)) {
        const L = flowOrder[flowIdx];
        const r = await api('/browse/' + bKind + '?letter=' + encodeURIComponent(L));
        if (seq !== flowSeq) return;
        if (r.status === 401) return gate();
        flowIdx++;
        const items = r.items || [];
        if (first) { box.innerHTML = ''; box.scrollLeft = 0; first = false; }
        const start = cardItems.length; cardItems.push(...items);
        box.insertAdjacentHTML('beforeend', items.map((x, i) => cardHtml(x, start + i, L)).join(''));
      }
      if (first && seq === flowSeq) box.innerHTML = '<div class="msg">Nothing here.</div>';
    } finally { flowBusy = false; }
  }
  function onCarouselClick(e) {
    const b = e.target.closest('.bc'); if (!b) return;
    const x = cardItems[+b.dataset.i]; if (!x) return;
    if (!bArtist && bKind === 'artists') browseArtist(x); else openAlbum(x, b);
  }
  function onCarouselScroll() {
    if (bArtist || scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
      scrollRaf = 0; const box = $('carousel');
      if (box.scrollWidth - box.scrollLeft - box.clientWidth < box.clientWidth * 2) flowMore(flowSeq, false);
      for (const c of box.querySelectorAll('.bc')) {
        if (c.offsetLeft + c.offsetWidth > box.scrollLeft + 24) { const L = c.dataset.l; if (L && L !== bLetter) { bLetter = L; paintLetters(); } break; }
      }
    });
  }
  // hold-to-scroll buttons: tap = one page, hold = glide
  function holdScroll(btn, dir) {
    const box = $('carousel'); let raf = 0, t0 = 0, held = false, tmr = 0;
    const step = () => { box.scrollLeft += dir * 9; raf = requestAnimationFrame(step); };
    const start = e => { e.preventDefault(); held = false; t0 = Date.now();
      tmr = setTimeout(() => { held = true; box.classList.add('hold'); raf = requestAnimationFrame(step); }, 250); };
    const end = () => { clearTimeout(tmr); cancelAnimationFrame(raf);
      if (held) { box.classList.remove('hold'); const w = box.querySelector('.bc'); if (w) { const u = w.offsetWidth + 12; box.scrollTo({ left: Math.round(box.scrollLeft / u) * u, behavior: 'smooth' }); } }
      else if (t0) { const c = box.querySelector('.bc'); const u = c ? c.offsetWidth + 12 : box.clientWidth; box.scrollBy({ left: dir * 2 * u, behavior: 'smooth' }); }
      held = false; t0 = 0; };
    btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', () => { clearTimeout(tmr); cancelAnimationFrame(raf); box.classList.remove('hold'); t0 = 0; });
    btn.addEventListener('pointerleave', () => { if (t0) end(); });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }
  async function openAlbum(a, btn) {
    document.querySelectorAll('.bc.sel').forEach(c => c.classList.remove('sel')); btn.classList.add('sel');
    albumCtx = a; $('results').innerHTML = '<div class="msg">Loading…</div>';
    const r = await api('/search?album_id=' + encodeURIComponent(a.id));
    if (r.status === 401) return gate();
    results = r.items || []; paintResults('album');
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  async function browseArtist(a) {
    bArtist = a; artist = a; albumCtx = null; results = []; paintResults();
    $('bnav').style.display = 'none'; $('letters').style.display = 'none';
    $('bpill').style.display = 'flex'; $('bpillName').textContent = a.name;
    await loadCards();
    const r = await api('/search?artist_id=' + encodeURIComponent(a.id) + '&artist=' + encodeURIComponent(a.name)); searchBusy = !!r.busy;
    results = r.items || []; paintResults('top');
  }
  async function searchArtists() {
    const q = $('qa').value.trim();
    if (q.length < 2) { $('artistList').innerHTML = ''; return; }
    const r = await api('/search-artists?q=' + encodeURIComponent(q));
    if (r.status === 401) return gate();
    const list = r.items || [];
    $('artistList').innerHTML = list.length ? list.map((a, i) =>
      `<button class="item" data-i="${i}">${a.image ? `<img class="round" src="${esc(a.image)}" alt="">` : '<div class="ph round"></div>'}<div class="nm"><div class="t">${esc(a.name)}</div></div></button>`).join('')
      : '<div class="msg">' + (r.busy ? 'Spotify is busy just now. Please try again in a minute.' : 'No artists found. Try another spelling.') + '</div>';
    $('artistList').querySelectorAll('.item').forEach(b => b.onclick = () => pickArtist(list[b.dataset.i]));
  }
  function pickArtist(a) {
    artist = a;
    $('artistStep').style.display = 'none'; $('artistList').innerHTML = '';
    $('artistPill').style.display = 'flex'; $('pillName').textContent = a.name;
    $('qt').style.display = ''; $('qt').value = '';
    loadTracks();
  }
  function resetArtist() {
    artist = null;
    $('artistStep').style.display = ''; $('qa').value = ''; $('artistList').innerHTML = '';
    $('artistPill').style.display = 'none'; $('qt').style.display = 'none'; $('qt').value = '';
    results = []; paintResults();
  }
  async function loadTracks() {
    if (!artist) return;
    const q = $('qt').value.trim();
    $('results').innerHTML = '<div class="msg">Loading…</div>';
    const r = await api('/search?artist_id=' + encodeURIComponent(artist.id) + '&artist=' + encodeURIComponent(artist.name) + (q.length >= 2 ? '&q=' + encodeURIComponent(q) : '')); searchBusy = !!r.busy;
    if (r.status === 401) return gate();
    results = r.items || []; paintResults(q.length >= 2 ? 'search' : 'top');
  }
  async function searchSongs() {
    const q = $('qs').value.trim();
    if (q.length < 2) { results = []; paintResults(); return; }
    const r = await api('/search?q=' + encodeURIComponent(q)); searchBusy = !!r.busy;
    if (r.status === 401) return gate();
    results = r.items || []; paintResults('search');
  }
  function paintResults(kind) {
    const el = $('results'); if (!el) return;
    if (!results.length) { el.innerHTML = kind ? '<div class="msg">' + (searchBusy ? 'Spotify is busy just now. Please try again in a minute.' : 'No tracks found. Try another spelling.') + '</div>' : ''; return; }
    const w = waits(); const end = w ? w.end : null;
    el.innerHTML = (kind === 'top' && artist ? `<div class="lbl">TOP TRACKS BY ${esc(artist.name.toUpperCase())}</div>` : kind === 'album' && albumCtx ? `<div class="lbl">${esc(albumCtx.name.toUpperCase())}</div>` : '') + results.map((x, i) =>
      `<button class="item" data-i="${i}">${x.image ? `<img src="${esc(x.image)}" alt="">` : '<div class="ph"></div>'}` +
      `<div class="nm"><div class="t">${esc(x.name)}</div><div class="a">${esc(x.artist)}</div></div>` +
      (end !== null ? `<div class="w">PLAYS IN<b>~${mmss(end)}</b></div>` : '') + `</button>`).join('');
    el.querySelectorAll('.item').forEach(b => b.onclick = () => confirmTrack(results[b.dataset.i]));
  }
  function sheet(html) { $('sheet').innerHTML = html; $('sheetBg').style.display = 'flex'; }
  function closeSheet() { $('sheetBg').style.display = 'none'; }
  $('sheetBg').onclick = e => { if (e.target === $('sheetBg')) closeSheet(); };

  function confirmTrack(t) {
    if (plays < 1) return openBuy();
    const w = waits();
    sheet(`<h2>${esc(t.name)}</h2><p>${esc(t.artist)}<br>This uses 1 play (you have ${plays}).${w ? ` It should play in about ${mmss(w.end)}.` : ''}</p>
      <div class="row2"><button class="btn ghost" id="no">CANCEL</button><button class="btn" id="yes">PLAY IT</button></div>`);
    $('no').onclick = closeSheet;
    $('yes').onclick = async () => {
      $('yes').disabled = true;
      const r = await api('/request', { method: 'POST', body: JSON.stringify({ device_id: device, uri: t.uri }) });
      closeSheet();
      if (r.ok) {
        plays = r.plays; paintBal(); mine.add(t.uri); ls.set('bb_mine', JSON.stringify([...mine].slice(-30)));
        setMode(mode);
        await pollState();
        const w2 = waits(); toast(`Queued! "${t.name}" plays in about ${w2 && w2.map[t.uri] !== undefined ? mmss(w2.map[t.uri]) : 'a few minutes'}.`);
      } else if (r.needPlays) { plays = 0; paintBal(); openBuy(); }
      else toast(r.error || 'Something went wrong. Try again.');
    };
  }

  // ── buying plays ──
  function openBuy() {
    sheet(`<h2>Get plays</h2><p>Each play puts one track in the queue. Pay by card, Apple Pay or Google Pay.</p>` +
      CFG.tiers.map(t => `<button class="tier" data-id="${t.id}"><span class="p">${esc(t.price)}</span><span class="g">${t.plays} PLAYS${t.best ? '<span class="b">BEST VALUE</span>' : ''}</span></button>`).join('') +
      `<button class="btn ghost" id="close" style="width:100%">CLOSE</button>`);
    $('close').onclick = closeSheet;
    document.querySelectorAll('.tier').forEach(b => b.onclick = async () => {
      document.querySelectorAll('.tier').forEach(x => x.disabled = true);
      ls.set('bb_plays_before', String(plays));
      const r = await api('/create-checkout', { method: 'POST', body: JSON.stringify({ device_id: device, tier: b.dataset.id }) });
      if (r.url) { location.href = r.url; return; }
      document.querySelectorAll('.tier').forEach(x => x.disabled = false);
      toast(r.error || 'Could not start checkout. Try again.');
    });
  }
  async function afterPayment() {
    const before = Number(ls.get('bb_plays_before') || 0);
    toast('Payment received. Adding your plays…', 8000);
    for (let i = 0; i < 20; i++) {
      await refreshBal();
      if (plays > before) { toast(`You now have ${plays} plays. Pick a track!`); return; }
      await new Promise(r => setTimeout(r, 2000));
    }
    toast(`Still adding your plays. If they don't appear, tell staff your code: ${code}`, 10000);
  }

  // ── start ──
  (async function init() {
    if (fromTable) {
      const tp = await (await fetch(W + '/table-pass?k=' + encodeURIComponent(fromTable))).json().catch(() => ({}));
      if (tp.token) { session = tp.token; ls.set('bb_session', session); }
      else return gate('This table QR is out of date. Scan the QR code on the screen, or ask the bar staff.');
    }
    if (!session) return gate();
    const ok = await (await fetch(W + '/check-session?s=' + encodeURIComponent(session))).json().catch(() => ({}));
    if (!ok.ok) return gate('Your hour has ended. Scan the QR code on your table or the screen to carry on. Your plays are kept.');
    shell();
    if (u.searchParams.get('paid') === '1') { u.searchParams.delete('paid'); history.replaceState(null, '', u.pathname + u.search); afterPayment(); }
  })();
})();
</script>
</body>
</html>
