<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edd &amp; Cheryl Jukebox</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
  :root { --g:#6ef0a0; --ink:#f3efe4; --mute:#cfd8d2; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none; }
  #stage {
    position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0;
    box-sizing:border-box; overflow:hidden; padding:28px 64px 0; display:flex; flex-direction:column;
    color:var(--ink); font-family:var(--f2);
    background:
      radial-gradient(60% 40% at 0% 50%, rgba(var(--glow),.55), transparent 70%),
      radial-gradient(60% 40% at 100% 50%, rgba(var(--glow),.55), transparent 70%),
      radial-gradient(80% 25% at 50% 100%, rgba(var(--glow),.35), transparent 70%), var(--bg);
  }
  .rule { flex:none; height:2px; background:var(--g); opacity:.7; }
  /* header */
  #logo { flex:none; height:320px; display:flex; justify-content:center; }
  #logo { align-items:center; flex-direction:column; justify-content:center; font-family:var(--f1); color:var(--g); text-align:center; line-height:.9; text-shadow:0 0 50px rgba(var(--gr),.5); }
  #logo .logo-img { width:720px; height:auto; filter:drop-shadow(0 6px 22px rgba(0,0,0,.8)); }
  #logo span { font-size:60px; letter-spacing:.4em; color:var(--ink); margin-top:2px; }
  #sub { flex:none; margin-top:8px; height:44px; display:flex; align-items:center; gap:24px; }
  #sub i { flex:1; height:2px; background:var(--g); opacity:.8; }
  #sub b { font-weight:500; font-size:24px; letter-spacing:.42em; color:var(--g); }
  /* now playing */
  #np { flex:none; margin-top:30px; height:300px; display:flex; align-items:center; gap:40px; }
  #glow { flex:none; width:280px; height:280px; border-radius:50%; animation:pulse 4s ease-in-out infinite; }
  #rec { position:relative; width:280px; height:280px; border-radius:50%; animation:spin 9s linear infinite; animation-play-state:paused;
         background:repeating-radial-gradient(circle at center,var(--groove1) 0,var(--groove1) 3px,var(--groove2) 3px,var(--groove2) 6px); }
  #rec.on { animation-play-state:running; }
  #rec .sheen { position:absolute; inset:0; border-radius:50%;
         background:conic-gradient(from 20deg,transparent 0%,rgba(255,255,255,.15) 6%,transparent 12%,transparent 50%,rgba(255,255,255,.1) 56%,transparent 62%,transparent 100%); }
  #rec .label { position:absolute; top:50%; left:50%; width:104px; height:104px; margin:-52px 0 0 -52px; border-radius:50%; box-sizing:border-box;
         border:2px solid var(--g); background:radial-gradient(circle,var(--lab1),var(--lab2)); display:flex; align-items:center; justify-content:center; text-align:center;
         font-family:var(--f1); font-size:22px; line-height:1; letter-spacing:.06em; }
  #rec .label.art { width:100%; height:100%; margin:-140px 0 0 -140px; border:0; background-size:cover; background-position:center; color:transparent; }
  #rec .sheen { z-index:2; } #rec .hole { z-index:3; }
  #rec .hole { position:absolute; top:50%; left:50%; width:11px; height:11px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--groove1); }
  @keyframes drift { 0% { transform:scale(1.18) translate(-4%,-3%) rotate(0deg); } 33% { transform:scale(1.3) translate(3.5%,-1%) rotate(1.2deg); } 66% { transform:scale(1.24) translate(2%,3.5%) rotate(-1deg); } 100% { transform:scale(1.18) translate(-4%,-3%) rotate(0deg); } }
  #bgart { animation:drift 45s ease-in-out infinite; position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(12px) brightness(.5) saturate(1.25); opacity:0; transition:opacity 1.2s; z-index:0; }
  #bgart.on { opacity:1; }
  #stage > :where(:not(#bgart):not(#offline)) { position:relative; z-index:1; }
  #npText { flex:1; min-width:0; display:flex; flex-direction:column; }
  #npHead { display:flex; align-items:flex-end; justify-content:space-between; }
  #npHead b { font-weight:600; font-size:26px; letter-spacing:.4em; color:var(--g); }
  #eq { display:flex; align-items:flex-end; gap:6px; height:52px; }
  #eq i { width:8px; height:14px; border-radius:3px; background:var(--g); }
  #eq.on i { animation:eq 1.1s ease-in-out infinite; }
  #eq.on i:nth-child(2){animation-delay:.2s} #eq.on i:nth-child(3){animation-delay:.45s}
  #eq.on i:nth-child(4){animation-delay:.1s} #eq.on i:nth-child(5){animation-delay:.35s}
  #title { margin-top:4px; font-family:var(--f1); font-size:118px; line-height:.98; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #artist { font-weight:500; font-size:36px; letter-spacing:.3em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar { margin-top:16px; height:12px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; }
  #bar i { display:block; width:0; height:100%; border-radius:6px; background:var(--g); box-shadow:0 0 14px var(--g); transition:width 1s linear; }
  #times { margin-top:6px; display:flex; justify-content:space-between; font-weight:500; font-size:24px; letter-spacing:.12em; color:var(--mute); }
  /* pick + qr */
  #pick { flex:none; margin-top:28px; height:330px; display:flex; gap:40px; }
  #pickL { flex:1; min-width:0; display:flex; flex-direction:column; }
  #pickL h2 { margin:0; font-family:var(--f1); font-weight:400; font-size:70px; line-height:1; color:var(--g); }
  #pickL p { margin:4px 0 0; font-weight:500; font-size:32px; letter-spacing:.24em; }
  #tiers { margin-top:18px; display:flex; flex-direction:column; gap:12px; }
  .tier { height:84px; box-sizing:border-box; padding:0 28px; display:flex; align-items:center; gap:18px; border-radius:14px; border:2px solid var(--g); background:rgba(var(--gr),.06); font-family:var(--f1); }
  .tier.best { background:rgba(var(--gr),.12); }
  .tier .pr { font-size:66px; line-height:1; color:var(--g); }
  .tier .eqs { font-size:50px; }
  .tier .n { font-size:66px; line-height:1; }
  .tier .pl { font-size:34px; letter-spacing:.04em; white-space:nowrap; }
  .tier .badge { margin-left:auto; padding:4px 14px; border-radius:8px; background:var(--g); color:var(--onG); font-family:var(--f2); font-weight:700; font-size:20px; line-height:1.1; letter-spacing:.1em; text-align:center; }
  #fcfp { margin-top:auto; font-weight:500; font-size:22px; letter-spacing:.34em; color:var(--mute); }
  #qrBox { flex:none; width:330px; height:330px; box-sizing:border-box; padding:24px; border-radius:6px; background:#fff; position:relative; }
  #qr { width:282px; height:282px; }
  #qr img, #qr canvas { width:282px !important; height:282px !important; display:block; }
  #qrMsg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:28px; box-sizing:border-box; background:#fff; color:#111; font-weight:600; font-size:24px; line-height:1.3; }
  /* queue */
  #qHead { margin-top:18px; height:46px; display:flex; align-items:center; justify-content:space-between; }
  #qHead b { font-weight:600; font-size:28px; letter-spacing:.4em; color:var(--g); }
  #qHead span { font-weight:500; font-size:20px; letter-spacing:.2em; color:var(--mute); }
  .row { height:78px; display:flex; align-items:center; gap:22px; border-bottom:1px solid rgba(255,255,255,.14); }
  .row:last-child { border-bottom:0; }
  .row .no { flex:none; width:54px; font-weight:500; font-size:32px; color:var(--g); }
  .row .nm { flex:1; min-width:0; }
  .row .t { font-weight:600; font-size:38px; line-height:1.08; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .a { font-weight:400; font-size:24px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .w { flex:none; display:flex; align-items:baseline; gap:14px; }
  .row .w span { font-weight:500; font-size:20px; letter-spacing:.16em; color:var(--g); }
  .row .w b { font-weight:600; font-size:40px; min-width:100px; text-align:right; }
  #qEmpty { height:156px; display:flex; align-items:center; font-family:var(--f3); font-style:italic; font-size:34px; color:var(--mute); }
  /* top 10 */
  #topHead { margin-top:16px; height:44px; display:flex; align-items:center; font-weight:600; font-size:28px; letter-spacing:.4em; color:var(--g); }
  #topGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:44px; font-weight:400; font-size:28px; }
  .tr { height:42px; display:flex; align-items:center; gap:16px; }
  .tr span { flex:none; width:40px; color:var(--g); }
  .tr em { font-style:normal; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* ticker */
  #tick { flex:none; margin-top:auto; margin-bottom:36px; height:64px; box-sizing:border-box; display:flex; align-items:center; border-top:2px solid var(--g); border-bottom:2px solid rgba(var(--gr),.3); }
  #tick b { flex:none; padding-right:22px; font-weight:600; font-size:22px; letter-spacing:.3em; color:var(--g); }
  #tickWrap { flex:1; min-width:0; overflow:hidden; white-space:nowrap; }
  #tickText { display:inline-block; padding-left:20px; font-family:var(--f3); font-style:italic; font-size:30px; animation:marq 30s linear infinite; }
  #offline { position:absolute; top:8px; right:14px; font-size:18px; letter-spacing:.2em; color:#ff9b9b; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes eq { 0%,100% { height:12px; } 50% { height:50px; } }
  @keyframes marq { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 3px var(--ring),0 0 40px rgba(var(--gr),.35); } 50% { box-shadow:0 0 0 3px var(--ring),0 0 64px rgba(var(--gr),.6); } }
  @media (prefers-reduced-motion:reduce) { #rec, #glow, #eq i, #tickText { animation:none !important; } }
</style>
<link rel="stylesheet" href="ghost-board.css">
</head>
<body>
<div id="stage">
  <div id="ghostScene" class="ghost-only" aria-hidden="true">
    <div class="ghost-cathedral"></div>
    <video id="ghostImpera" data-src="assets/ghost-impera-loop.mp4" poster="assets/ghost-impera.webp" preload="none" muted loop playsinline disablepictureinpicture></video>
    <video id="ghostSkeleta" data-src="assets/ghost-skeleta-loop.mp4" poster="assets/ghost-skeleta.webp" preload="none" muted loop playsinline disablepictureinpicture></video>
    <div class="ghost-shade"></div><div class="ghost-beams"></div>
    <div class="ghost-fog fog-back"></div><div class="ghost-fog fog-front"></div>
    <div id="ghostEmbers"></div><div class="ghost-vignette"></div>
  </div>
  <div id="ghostQueueFrame" class="ghost-only" aria-hidden="true"></div>
  <div id="ghostWelcome" class="ghost-only">A PRIVATE RITUAL · EDD &amp; CHERYL</div>
  <div id="ghostTools" class="ghost-only">
    <button id="ghostArtView" type="button" aria-pressed="false">ART VIEW</button>
    <button id="ghostMotion" type="button" aria-pressed="true">ATMOSPHERE ON</button>
    <button id="ghostFullscreen" type="button">FULL SCREEN</button>
  </div>
  <div id="bgart"></div>
  <div id="offline">RECONNECTING…</div>
  <div id="logo"><img class="logo-img" src="assets/cheryl-edd-logo.webp" alt="Cheryl &amp; Edd" width="1400" height="518"><span data-tx="jb">JUKEBOX</span></div>
  <div id="sub"><i></i><b data-tx="sub">HOME SWEET HOME</b><i></i></div>

  <div id="np">
    <div id="glow"><div id="ghostHalo" class="ghost-only" aria-hidden="true"></div><div id="rec"><div class="sheen"></div><div class="label">EDD &amp;<br>CHERYL</div><div class="hole"></div></div></div>
    <div id="npText">
      <div id="npHead"><b>NOW PLAYING</b><div id="eq"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div id="title">Waiting for music</div>
      <div id="artist">&nbsp;</div>
      <div id="bar"><i></i></div>
      <div id="times"><span id="tPos">0:00</span><span id="tLeft"></span></div>
    </div>

  <div id="ghostTransport" class="ghost-only" role="group" aria-label="Playback controls">
    <button id="ghostPlay" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>PLAY</span></button>
    <button id="ghostSkip" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l10-7zM17 5h3v14h-3z"/></svg><span>NEXT</span></button>
    <button id="ghostBrowse" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>CHOOSE MUSIC</span></button>
  </div>
  <div id="ghostNotice" class="ghost-only" role="status" aria-live="polite"></div>
  <div id="ghostScenes" class="ghost-only" role="group" aria-label="Visual scenes">
    <div class="ghost-scenes-heading"><span>THE VISUAL CHAPTERS</span><small>Choose the atmosphere</small></div>
    <div class="ghost-scene-options">
      <button type="button" data-scene="cathedral" aria-pressed="true"><img src="assets/ghost-cathedral.webp" alt="" loading="lazy"><span><small>CHAPTER I</small><b>The Cathedral</b><em>CANDLELIGHT &amp; SPECTRAL FOG</em></span></button>
      <button type="button" data-scene="impera" aria-pressed="false"><img src="assets/ghost-impera.webp" alt="" loading="lazy"><span><small>CHAPTER II</small><b>Impera</b><em>ANIMATED ALBUM ART</em></span></button>
      <button type="button" data-scene="skeleta" aria-pressed="false"><img src="assets/ghost-skeleta.webp" alt="" loading="lazy"><span><small>CHAPTER III</small><b>Skeletá</b><em>ANIMATED ALBUM ART</em></span></button>
    </div>

    <div id="qrBox"><div id="qr"></div><div id="qrMsg"></div></div>

  <div class="rule" style="margin-top:28px"></div>

  <div id="qHead"><b>UP NEXT</b><span id="qCount"></span></div>

  <div class="rule" style="margin-top:16px"></div>

  <div id="topHead">ALL-TIME TOP 10</div>

  <div id="tick"><b>FROM THE HOUSE</b><div id="tickWrap"><span id="tickText"></span></div></div>
</div>

<dialog id="ghostLibrary" aria-labelledby="ghostLibraryTitle">
  <div class="ghost-library-head"><h2 id="ghostLibraryTitle">Choose your next track</h2><form method="dialog"><button aria-label="Close music library">✕</button></form></div>
  <iframe id="ghostLibraryFrame" title="Music library and song requests"></iframe>
</dialog>

<script src="config.js"></script>
<script src="theme.js"></script>
<script>
(function () {
  const CFG = window.BANSHEE;
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  // The Ghost set fills a landscape TV; the existing portrait and Classic boards stay available.
  function fit() {
    const wide = document.documentElement.dataset.theme === 'gothic' && innerWidth >= innerHeight;
    const w = wide ? 1920 : 1080, h = wide ? 1080 : 1920;
    const s = Math.min(innerWidth / w, innerHeight / h);
    stage.dataset.layout = wide ? 'landscape' : 'portrait';
    document.documentElement.dataset.boardLayout = stage.dataset.layout;
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    stage.style.transform = `scale(${s})`;
    stage.style.left = (innerWidth - w * s) / 2 + 'px';
    stage.style.top = (innerHeight - h * s) / 2 + 'px';
    fitTitle($('title').textContent, true);
  }
  addEventListener('resize', () => { fit(); syncGhostMotion(); });
  addEventListener('jukeboxthemechange', () => { fit(); syncGhostMotion(); });
  fit();
  document.fonts.ready.then(() => { if (document.documentElement.dataset.theme === 'gothic') fitTitle($('title').textContent, true); });

  // Price cards
  $('tiers').innerHTML = `<div class="tier best"><span class="pr">FREE</span><span class="eqs">=</span><span class="pl">PLAY AS MUCH AS YOU LIKE</span></div>`;

  const mmss = ms => { ms = Math.max(0, Math.round(ms / 1000)); return Math.floor(ms / 60) + ':' + String(ms % 60).padStart(2, '0'); };

  // ── Now playing + queue ──
  let state = null, offlineCount = 0, lastTrackId = null, lastGood = null, lastGoodAt = 0;
  async function pollState() {
    try {
      const r = await fetch(CFG.workerUrl + '/state');
      const ns = await r.json(); ns.recvAt = Date.now();
      if (ns.track) { lastGood = ns; lastGoodAt = Date.now(); }
      else if (lastGood && Date.now() - lastGoodAt < 12000) { offlineCount = 0; return; } // ignore brief 'nothing playing' blips
      state = ns; if (window.applyTheme && ns.theme) window.applyTheme(ns.theme);
      offlineCount = 0; $('offline').style.display = 'none';
      render(); onTrackChange();
    } catch (e) {
      if (++offlineCount >= 3) $('offline').style.display = 'block';
    }
  }
  function nowProgress() {
    if (!state || !state.track) return 0;
    return state.track.progress + (state.playing ? Date.now() - state.recvAt : 0);
  }
  function render() {
    const s = state, t = s && s.track;
    const on = !!(s && s.playing);
    stage.dataset.playing = String(on);
    paintGhostControls(); syncGhostMotion();
    $('rec').classList.toggle('on', on);
    $('eq').classList.toggle('on', on);
    fitTitle(t ? t.name : 'Waiting for music');
    const lab = document.querySelector('#rec .label'), art = t && t.image ? (t.image.charAt(0) === '/' ? CFG.workerUrl + t.image : t.image) : '';
    if ($('bgart').dataset.art !== art) { $('bgart').dataset.art = art; $('bgart').style.backgroundImage = art ? 'url("' + art + '")' : ''; $('bgart').classList.toggle('on', !!art); }
    if (lab.dataset.art !== art) { lab.dataset.art = art; lab.style.backgroundImage = art ? 'url("' + art + '")' : ''; lab.classList.toggle('art', !!art); }
    if (!t) {
      $('title').textContent = 'Waiting for music';
      $('artist').innerHTML = '&nbsp;';
      $('tPos').textContent = '0:00'; $('tLeft').textContent = '';
      $('bar').firstElementChild.style.width = '0';
    } else {
      $('artist').textContent = t.artist;
      tickProgress();
    }
    // Queue with wait times
    const q = (s && s.queue) || [];
    const remaining = t ? Math.max(0, t.duration - nowProgress()) : 0;
    $('qCount').textContent = q.length ? (q.length === 1 ? '1 TRACK WAITING' : q.length + ' TRACKS WAITING') : '';
    if (!q.length) {
      $('queue').innerHTML = '<div id="qEmpty">The queue is empty. Scan the code and pick the next track.</div>';
    } else {
      let acc = remaining;
      $('queue').innerHTML = q.slice(0, 4).map((x, i) => {
        const when = acc; acc += x.duration;
        return `<div class="row"><div class="no">${String(i + 1).padStart(2, '0')}</div>` +
               `<div class="nm"><div class="t">${esc(x.name)}</div><div class="a">${esc(x.artist)}</div></div>` +
               `<div class="w"><span>PLAYS IN</span><b data-wait="${when}">${mmss(when)}</b></div></div>`;
      }).join('');
      state.qBase = { at: Date.now(), remaining };
    }
  }
  // Long titles shrink to fit on one line instead of being cut off.
  function fitTitle(text, force = false) {
    const el = $('title'), wide = stage.dataset.layout === 'landscape';
    if (!force && el.dataset.text === text) return;
    el.dataset.text = text; el.textContent = text;
    let size = wide ? 90 : 118; el.style.fontSize = size + 'px';
    while ((el.scrollWidth > el.clientWidth || (wide && el.scrollHeight > 188)) && size > (wide ? 38 : 52)) {
      size -= 4; el.style.fontSize = size + 'px';
    }
  }
  function tickProgress() {
    if (!state || !state.track) return;
    const t = state.track, pos = Math.min(t.duration, nowProgress());
    $('bar').firstElementChild.style.width = (pos / t.duration * 100).toFixed(1) + '%';
    $('tPos').textContent = mmss(pos);
    $('tLeft').textContent = mmss(t.duration - pos) + ' REMAINING';
    // keep the wait times counting down between polls
    if (state.qBase && state.playing) {
      const elapsed = Date.now() - state.qBase.at;
      document.querySelectorAll('#queue [data-wait]').forEach(el => {
        el.textContent = mmss(Number(el.dataset.wait) - elapsed);
      });
    }
  }
  setInterval(tickProgress, 1000);
  pollState(); setInterval(pollState, 5000);

  // ── Top 10 ──
  async function loadTop() {
    try {
      const { top } = await (await fetch(CFG.workerUrl + '/top10')).json();
      const rows = Array.from({ length: 10 }, (_, i) => top[i]);
      const cell = (x, i) => `<div class="tr"><span>${String(i + 1).padStart(2, '0')}</span><em>${x ? esc(x.name) : '—'}</em></div>`;
      $('topGrid').innerHTML =
        `<div>${rows.slice(0, 5).map((x, i) => cell(x, i)).join('')}</div>` +
        `<div>${rows.slice(5).map((x, i) => cell(x, i + 5)).join('')}</div>`;
    } catch (e) {}
  }
  loadTop(); setInterval(loadTop, 120000);

  // ── Ticker: venue lines + an AI fun fact for the current track ──
  const QUIPS = [
    'Edd and Cheryl’s house, Edd and Cheryl’s rules.',
    'Somebody has to choose the next one. Why not you?',
    'No coins required.',
    'Turn it up. The neighbours are used to it.',
];
  let fact = '';
  function setTicker() {
    const line = (fact ? fact + '     •     ' : '') + QUIPS.join('     •     ');
    const unit = line + '          ';
    $('tickText').innerHTML = esc(unit) + esc(unit);
    $('tickText').style.animationDuration = Math.max(25, unit.length * 0.2) + 's';
  }
  setTicker();
  async function onTrackChange() {
    const t = state && state.track;
    const id = t ? t.id : null;
    if (id === lastTrackId) return;
    lastTrackId = id; fact = ''; setTicker();
    if (!t) return;
    try {
      const r = await (await fetch(`${CFG.workerUrl}/fact?name=${encodeURIComponent(t.name)}&artist=${encodeURIComponent(t.artist)}`)).json();
      if (r.fact && lastTrackId === id) { fact = r.fact; setTicker(); }
    } catch (e) {}
  }

  // ── QR code: carries the rotating session token ──
  // Open this page once as board.html?key=YOUR_DISPLAY_KEY on the TV PC.
  const keyParam = new URLSearchParams(location.search).get('key');
  try { if (keyParam) { localStorage.setItem('bb_display_key', keyParam); history.replaceState(null, '', location.pathname); } } catch (e) {}
  let displayKey = ''; try { displayKey = localStorage.getItem('bb_display_key') || ''; } catch (e) {}
  let qrToken = null, qrObj = null;
  let ghostScene = 'cathedral', ghostMotion = true, ghostBusy = false;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  function showQrMsg(msg) { const m = $('qrMsg'); m.textContent = msg; m.style.display = msg ? 'flex' : 'none'; }
  async function refreshQr() {
    if (!displayKey) { showQrMsg('Display key missing. Open this page once with ?key=YOUR_KEY'); return; }
    try {
      const r = await fetch(CFG.workerUrl + '/session-token', { headers: { 'X-Display-Key': displayKey } });
      if (!r.ok) { showQrMsg('Display key not accepted'); return; }
      const { token } = await r.json();
      showQrMsg('');
      if (token === qrToken) return;
      qrToken = token;
      paintGhostControls();
      const link = new URL('./', location.href).href + '?s=' + encodeURIComponent(token);
      $('qr').innerHTML = '';
      qrObj = new QRCode($('qr'), { text: link, width: 564, height: 564, correctLevel: QRCode.CorrectLevel.M });
    } catch (e) { /* keep showing the current code */ }
  }
  refreshQr(); setInterval(refreshQr, 10 * 60 * 1000);


  // ── Ghost landscape theatre ──
  function paintGhostControls() {
    const playing = !!(state && state.playing), ready = !!qrToken;
    $('ghostPlay').disabled = !ready || ghostBusy;
    $('ghostSkip').disabled = !ready || ghostBusy;
    $('ghostBrowse').disabled = !ready;
    $('ghostPlay').setAttribute('aria-label', playing ? 'Pause playback' : 'Resume playback');
    $('ghostPlay').querySelector('span').textContent = playing ? 'PAUSE' : 'PLAY';
    $('ghostPlay').querySelector('svg').innerHTML = playing
      ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  }
  function ghostMessage(message) {
    $('ghostNotice').textContent = message;
    clearTimeout(ghostMessage.timer);
    ghostMessage.timer = setTimeout(() => { $('ghostNotice').textContent = ''; }, 6500);
  }
  async function ghostControl(command, retry = true) {
    if (!qrToken || ghostBusy) return;
    ghostBusy = true; paintGhostControls();
    try {
      const r = await fetch(CFG.workerUrl + '/control/' + command, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session': qrToken },
      });
      if (r.status === 401 && retry) {
        await refreshQr(); ghostBusy = false;
        return await ghostControl(command, false);
      }
      if (!r.ok) throw new Error('The player could not accept that command. Please try again.');
      if (state && command !== 'skip') { state.playing = command === 'play'; stage.dataset.playing = String(state.playing); }
      paintGhostControls(); syncGhostMotion();
      ghostMessage(command === 'skip' ? 'Next track requested.' : command === 'pause' ? 'Playback paused.' : 'Playback resumed.');
      setTimeout(pollState, 1800);
    } catch (e) { ghostMessage(e.message || 'Could not reach the jukebox. Please try again.'); }
    finally { ghostBusy = false; paintGhostControls(); }
  }
  function syncGhostMotion() {
    const active = document.documentElement.dataset.theme === 'gothic' && stage.dataset.layout === 'landscape';
    // Reduced-motion and atmosphere-off modes leave a still image, including for the videos.
    const moving = active && ghostMotion && !reducedMotion.matches && !document.hidden;
    stage.dataset.motion = moving ? 'on' : 'off';
    $('ghostMotion').setAttribute('aria-pressed', String(ghostMotion && !reducedMotion.matches));
    $('ghostMotion').textContent = moving ? 'ATMOSPHERE ON' : 'ATMOSPHERE STILL';
    for (const [scene, id] of [['impera', 'ghostImpera'], ['skeleta', 'ghostSkeleta']]) {
      const video = $(id), selected = active && scene === ghostScene;
      if (selected && !video.getAttribute('src')) { video.src = video.dataset.src; video.load(); }
      if (selected && moving && state && state.playing) {
        if (video.paused) video.play().catch(() => { /* the poster is the video fallback */ });
      } else video.pause();
    }
  }
  function setGhostScene(scene) {
    if (!['cathedral', 'impera', 'skeleta'].includes(scene)) return;
    ghostScene = scene; stage.dataset.scene = scene;
    document.querySelectorAll('#ghostScenes [data-scene]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.scene === scene)));
    syncGhostMotion();
  }
  $('ghostPlay').onclick = () => ghostControl(state && state.playing ? 'pause' : 'play');
  $('ghostSkip').onclick = () => ghostControl('skip');
  $('ghostArtView').onclick = () => {
    const immersive = stage.dataset.immersive !== 'true';
    stage.dataset.immersive = String(immersive);
    $('ghostArtView').setAttribute('aria-pressed', String(immersive));
    $('ghostArtView').textContent = immersive ? 'SHOW JUKEBOX' : 'ART VIEW';
    fitTitle($('title').textContent, true);
  };
  $('ghostMotion').onclick = () => { ghostMotion = !ghostMotion; syncGhostMotion(); };
  $('ghostFullscreen').onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) { ghostMessage('Use F11 on the jukebox PC to enter full screen.'); }
  };
  document.addEventListener('fullscreenchange', () => {
    $('ghostFullscreen').textContent = document.fullscreenElement ? 'EXIT FULL SCREEN' : 'FULL SCREEN'; fit();
  });
  $('ghostBrowse').onclick = () => {
    if (!qrToken) return;
    $('ghostLibraryFrame').src = new URL('./', location.href).href + '?s=' + encodeURIComponent(qrToken);
    $('ghostLibrary').showModal();
  };
  $('ghostLibrary').addEventListener('close', () => { $('ghostLibraryFrame').src = 'about:blank'; });
  $('ghostLibrary').addEventListener('click', e => { if (e.target === $('ghostLibrary')) $('ghostLibrary').close(); });
  document.querySelectorAll('#ghostScenes [data-scene]').forEach(button => { button.onclick = () => setGhostScene(button.dataset.scene); });
  document.addEventListener('visibilitychange', syncGhostMotion);
  reducedMotion.addEventListener('change', syncGhostMotion);
  $('ghostEmbers').innerHTML = Array.from({ length: 26 }, (_, i) =>
    `<i style="--x:${(i * 37 + 11) % 100}%;--delay:-${i * 1.7}s;--duration:${14 + i % 12}s;--size:${i % 3 + 2}px"></i>`).join('');
  $('ghostHalo').innerHTML = '<svg viewBox="0 0 600 600" focusable="false"><g fill="none" stroke="currentColor">' +
    '<circle cx="300" cy="300" r="284"/><circle cx="300" cy="300" r="270" stroke-dasharray="1 15" stroke-width="5"/>' +
    '<circle cx="300" cy="300" r="248"/><circle cx="300" cy="300" r="222" stroke-dasharray="70 14"/>' +
    Array.from({ length: 16 }, (_, i) => `<path d="M300 8V64M288 40h24M300 70l10 15-10 15-10-15z" transform="rotate(${i * 22.5} 300 300)"/>`).join('') +
    '</g></svg>';
  setGhostScene('cathedral');

  // Gentle nightly refresh at 03:30 so the page never goes stale.
  setInterval(() => { const d = new Date(); if (d.getHours() === 3 && d.getMinutes() === 30 && d.getSeconds() < 30) location.reload(); }, 30000);
})();
</script>
</body>
</html>
