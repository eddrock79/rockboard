name = "banshee-local-test"
main = "cloudflare-worker-local.js"
compatibility_date = "2025-04-01"

[vars]
# This worker also serves the pages (board, guest page, staff) from ./local-site, so SITE_URL is itself.
SITE_URL = "https://banshee-local-test.eddrock79.workers.dev"

[assets]
directory = "./local-site"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

# Secrets (npx wrangler secret put NAME -c wrangler-local.toml):
#   SESSION_SECRET, DISPLAY_KEY, STAFF_PIN, PLAYER_KEY
#   optional: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY
