name = "banshee-jukebox"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"

[vars]
# Where the jukebox pages are hosted (no trailing slash). Used for CORS and Stripe return links.
SITE_URL = "https://rockboard.hauntedpubs.co.uk"
# AI_MODEL = "claude-haiku-5-5"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

# Secrets are set with `npx wrangler secret put NAME` and never go in this file:
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SPOTIFY_REFRESH_TOKEN
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#   SESSION_SECRET, DISPLAY_KEY, STAFF_PIN
#   ANTHROPIC_API_KEY (optional: AI fun facts)
