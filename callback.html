<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Banshee Jukebox · Spotify setup</title>
<style>
  body{font-family:monospace;background:#050706;color:#f3efe4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:16px;text-align:center;padding:20px}
  h1{font-size:30px;letter-spacing:6px;color:#6ef0a0;margin:0}
  p{color:rgba(243,239,228,.6);font-size:14px;letter-spacing:2px;line-height:1.8}
  .code{background:rgba(110,240,160,.08);border:1px solid rgba(110,240,160,.3);border-radius:8px;padding:16px;word-break:break-all;color:#6ef0a0;font-size:12px;max-width:600px}
</style>
</head>
<body>
<h1>BANSHEE JUKEBOX</h1>
<p>SPOTIFY SETUP PAGE<br>This page only shows a one-time code. It never stores it.</p>
<div id="out"></div>
<script>
  const p = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  if (p.get('code')) {
    out.innerHTML = '<p>COPY THIS CODE (use it once, then close this tab):</p><div class="code"></div>';
    out.querySelector('.code').textContent = p.get('code');
  } else if (p.get('error')) {
    out.innerHTML = '<p style="color:#ff8a8a">ERROR: </p>';
    out.querySelector('p').textContent += p.get('error');
  }
</script>
</body>
</html>
